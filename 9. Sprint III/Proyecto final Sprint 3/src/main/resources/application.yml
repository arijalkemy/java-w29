# Default properties file
spring:
  jpa:
    open-in-view: false
  profiles:
    active: ${SCOPE_SUFFIX} # Comma-separated list of active profiles. Can be overridden by a command line switch.
  mvc:
    throw-exception-if-no-handler-found: true # Whether a "NoHandlerFoundException" should be thrown if no Handler was found to process a request.
  web:
    resources:
      add-mappings: false
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  compression:
    enabled: true # Whether response compression is enabled.
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json # Comma-separated list of MIME types that should be compressed.
    min-response-size: 1024 # Minimum "Content-Length" value that is required for compression to be performed.

springdoc:
  packages-to-scan: com.mercadolibre.final_project_bootcamp_esp_32.controller
  show-actuator: true
  swagger-ui:
    operations-sorter: alpha
    disable-swagger-default-url: true

app:
  title: final-project-bootcamp-esp-32
  description: '@project.description@'
  version: @project.version@

management:
  endpoints:
    web:
      exposure:
        include: env
  endpoint:
    env:
      show-values: ALWAYS

logging:
  level:
    org:
      springframework:
        core:
          env: debug

application:
  security:
    jwt:
      #secret-key: ${SECRET_KEY}
      secret-key: EstaEsUnaClaveSuperSecretaParaFirmarElJWT123