spring.application.name=BonusEj1
server.port=8080
# Configuración de MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/Garment
spring.datasource.username=root
spring.datasource.password=ciro
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de H2 (solo para pruebas, comentar si no se usa)
# spring.datasource.url=jdbc:h2:mem:testdb
