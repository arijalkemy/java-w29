version: '3.8'

services:
  mysql:
    image: mysql:latest
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password       # Cambia esta contraseña por una más segura
      MYSQL_DATABASE: database               # Nombre de la base de datos a crear
      MYSQL_USER: user                          # Usuario adicional
      MYSQL_PASSWORD: password             # Contraseña para el usuario adicional
    ports:
      - "3306:3306"                             # Mapea el puerto 3306 del host al contenedor
    volumes:
      - db_data:/var/lib/mysql                  # Monta un volumen para persistir los datos

volumes:
  db_data: